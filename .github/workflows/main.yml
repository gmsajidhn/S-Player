name: Build S Player APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splayer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip uploaded project (if a zip was uploaded)
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -iname "SPlayer*.zip" -not -path "./extracted/*" | head -n 1)
          if [[ -n "$ZIP" ]]; then
            echo "Found zip: $ZIP"
            rm -rf extracted
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
          else
            echo "No zip found - using the files in the repository directly"
          fi

      - name: Detect Android project directory
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -maxdepth 4 -name settings.gradle -not -path "*/build/*" | while read -r s; do d=$(dirname "$s"); if [[ -f "$d/app/build.gradle" ]]; then echo "$d"; fi; done | sort | tail -n 1)
          if [[ -z "$SETTINGS" ]]; then
            echo "Could not find settings.gradle together with app/build.gradle."
            echo "Upload SPlayer.zip (or the unzipped project files) to the repository."
            exit 1
          fi
          echo "PROJECT_DIR=${SETTINGS}" >> "$GITHUB_ENV"
          echo "Project directory: ${SETTINGS}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK (already installed on the runner)
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SM" ]]; then SM=$(command -v sdkmanager || true); fi
          if [[ -n "$SM" ]]; then
            yes | "$SM" --licenses >/dev/null || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Gradle and project configuration
        run: |
          gradle --version
          gradle -p "$PROJECT_DIR" tasks --no-daemon --stacktrace

      - name: Build release APK (small, R8 shrunk)
        run: gradle -p "$PROJECT_DIR" clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "APK was not created: $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-Player-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
